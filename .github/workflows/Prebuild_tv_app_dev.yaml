name: app-tv_prebuild-dev

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
    paths:
      - 'simple_live_tv_app/**'
# If previous workflow is still running, we push again, we will cancel the previous workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      # 签出代码
      - uses: actions/checkout@v7
        with:
          ref: dev

      # APK 签名设置
      - name: Download tv keystore
        id: TV_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.TV_KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.TV_keystore.outputs.filePath }}" > simple_live_tv_app/android/key.properties
          echo "storePassword=${{ secrets.TV_STORE_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyPassword=${{ secrets.TV_KEY_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyAlias=${{ secrets.TV_KEY_ALIAS }}" >> simple_live_tv_app/android/key.properties

      # 设置 JAVA 环境
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            simple_live_tv_app/android/*.gradle*
            simple_live_tv_app/android/**/gradle-wrapper.properties

      # 设置 Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: simple_live_tv_app/pubspec.yaml
          cache: true

      # 更新 Flutter 的 packages
      - name: Restore packages
        run: |
          cd simple_live_tv_app
          flutter pub get

      # 读取版本号与构建时间（产物命名用）
      - name: Read version
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/tv_app_version.json
      - name: Prepare artifact naming metadata
        shell: bash
        run: |
          echo "VERSION=${{ fromJson(steps.version.outputs.content).version }}" >> "$GITHUB_ENV"
          echo "BUILD_TS=$(TZ=Asia/Shanghai date +%y%m%d%H%M%S)" >> "$GITHUB_ENV"

      # 打包 APK
      - name: Build APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      # 按 {产品名}_V{版本号}_{平台}_{代号}_({语言})_{构建类型}_{发布编号}_(Build{构建时间}) 规范重命名
      - name: Rename APK artifacts
        shell: bash
        run: |
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="simple_live_tv_app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            dst="simple_live_tv_app/build/app/outputs/flutter-apk/Slive_V${VERSION}_android-${abi}_tv_(zh-cn)_release_${{ github.run_number }}_(Build${BUILD_TS}).apk"
            mv "$src" "$dst"
          done