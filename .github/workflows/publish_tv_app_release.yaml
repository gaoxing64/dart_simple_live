name: app-tv-build-action-release
# 手动触发
on:
  workflow_dispatch:
jobs:
  build-tv:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      # 签出代码 
      - uses: actions/checkout@v4
        with:
          ref: master
          # 生成更新日志需要完整历史与标签
          fetch-depth: 0
        
      # APK 签名设置
      - name: Download Android keystore
        id: android_tv_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.TV_KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_tv_keystore.outputs.filePath }}" > simple_live_tv_app/android/key.properties
          echo "storePassword=${{ secrets.TV_STORE_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyPassword=${{ secrets.TV_KEY_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyAlias=${{ secrets.TV_KEY_ALIAS }}" >> simple_live_tv_app/android/key.properties

      # 设置 JAVA 环境
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "17"
          cache: "gradle"
    
      # 设置 Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_tv_app/pubspec.yaml
          cache: true

      # 更新 Flutter 的 packages
      - name: Restore packages
        run: |
          cd simple_live_tv_app
          flutter pub get
        
      # 读取版本号与构建时间（产物命名用，与下方发版读取相互独立）
      - name: Read version for naming
        id: naming_version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/tv_app_version.json
      - name: Prepare artifact naming metadata
        shell: bash
        run: |
          echo "VERSION=${{ fromJson(steps.naming_version.outputs.content).version }}" >> "$GITHUB_ENV"
          echo "BUILD_TS=$(TZ=Asia/Shanghai date +%y%m%d%H%M%S)" >> "$GITHUB_ENV"

      # 打包 APK
      - name: Build APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      # 按 {产品名}_V{版本号}_{平台}_{代号}_({语言})_{构建类型}_{发布编号}_(Build{构建时间}) 规范重命名
      - name: Rename APK artifacts
        shell: bash
        run: |
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="simple_live_tv_app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            dst="simple_live_tv_app/build/app/outputs/flutter-apk/Slive_V${VERSION}_android-$abi_tv_(zh-cn)_release_${{ github.run_number }}_(Build${BUILD_TS}).apk"
            mv "$src" "$dst"
          done

      # 上传 APK 至 Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android_tv
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/Slive_*.apk
    
      # 读取版本信息
      - name: Read version
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/tv_app_version.json
      - name: Echo version
        run: echo "${{ fromJson(steps.version.outputs.content).version }}"
      - name: Echo version content
        run: echo "${{ fromJson(steps.version.outputs.content).version_desc }}"
    
      # 生成更新日志：手写摘要（version_desc）+ 自动 What's Changed / Full Changelog
      # 版本与 tag 由 assets/tv_app_version.json 推导，不依赖 github.ref_name
      # （本 workflow 只有 workflow_dispatch，ref_name 恒为分支名，不是 tag）。
      - name: Generate release notes
        id: notes
        shell: bash
        env:
          # 不可信输入走环境变量，不直接拼进 run 脚本
          REPO: ${{ github.repository }}
          VERSION_DESC_FILE: assets/tv_app_version.json
          TAG_PREFIX: tv_v
        run: |
          PY=$(command -v python || command -v python3)
          if ! "$PY" tools/gen_changelog.py \
            --previous-tag auto \
            --repo "$REPO" \
            --version-desc-file "$VERSION_DESC_FILE" \
            --tag-prefix "$TAG_PREFIX" \
            --header "# Android TV" \
            --output release-notes.md
          then
            # 不用 continue-on-error：那样失败会被完全吞掉，连日志里都看不到。
            # 这里打一条能在 Actions 运行列表里看到的 error，但不让发版整体失败。
            echo "::error::生成更新日志失败，Release 正文回退为 version_desc"
          fi
          # 只有文件存在且非空才交给 Release：body_path 指向不存在的文件
          # 会让 Upload Release 报 ENOENT 而失败。
          if [ -s release-notes.md ]; then
            echo "file=release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      # 上传至 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          # 生成成功（文件非空）时用生成内容（已含 # Android TV 标题与摘要）；
          # 否则只用下面的 version_desc
          body_path: ${{ steps.notes.outputs.file }}
          body: "# Android TV \n${{ fromJson(steps.version.outputs.content).version_desc }}"
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          token: ${{ secrets.TOKEN }}
          files: |
            simple_live_tv_app/build/app/outputs/flutter-apk/Slive_*.apk
        
      # 完成
      - run: echo "🍏 This job's status is ${{ job.status }}."
