name: simple_live_core
version: 1.1.0
description: "聚合直播核心库（Rust Core + FRB 绑定层）"
repository: https://github.com/xiaoyaocz/dart_simple_live
publish_to: "none"
environment: 
  sdk: '>=3.0.5 <4.0.0'

# Dart 侧只剩三件事（协议实现 100% 在 crates/slive-core，见 ADR-014）：
#   1. lib/src/model + lib/src/interface —— App/TV 消费的跨平台模型与 LiveSite 契约；
#   2. lib/src/bridge —— rust_*_site.dart，把 FRB 模型翻译成上面这套模型（零协议逻辑）；
#   3. lib/src/rust —— FRB 生成物（入库）。
dependencies:
  flutter:
    sdk: flutter
  # CoreLog 的实现依赖（App/TV 通过 CoreLog.onPrintLog 接管日志输出）
  logger: ^2.6.2
  # FRB Dart 运行时：lib/src/rust（frb_generated）+ lib/src/bridge（绑定层）所需
  # 精确钉版本：两侧（Rust Cargo.toml）版本漂移会让 RustLib.init() 静默抛异常（Spec §10 / advisory-3）
  flutter_rust_bridge: 2.13.0
  # FRB 枚举 -> Dart sealed class 的生成依赖（LiveDanmuItem / LiveMessageData 等，对齐上游 slive_core 实践）
  # 3.x：FRB 2.13 生成物为 `@freezed sealed class` 风格，与 3.x 兼容；2.x 与 hive_ce_generator(build^4) 冲突
  freezed_annotation: ^3.0.0

dev_dependencies: 
  lints: ^6.0.0

