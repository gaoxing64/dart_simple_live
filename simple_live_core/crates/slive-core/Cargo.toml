[package]
name = "slive-core"
version = "0.1.0"
edition = "2021"
description = "Simple Live 纯核心 crate（无 FRB 依赖，供 Flutter/FRB/Tauri 等前端复用）"
publish = false

[lib]
crate-type = ["rlib"]

[features]
# held-out 留出集（真实抓包，实现者不可见）：`cargo test --features heldout`（ADR-011，四平台沿用）
heldout = []

[dependencies]
# 序列化 / 错误 / 异步
serde = { version = "1", features = ["derive"] }
# preserve_order：emots 映射必须按插入序遍历（对齐 Dart LinkedHashMap），
# 顺序影响「上限 8 入口截断」的结果（F-16）
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
async-trait = "0.1"

# HTTP：统一 rustls（纯 Rust，规避 Android OpenSSL 构建，见 docs/rust-core/10-architecture.md §8.1 / ADR-003）
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "cookies",
    "gzip",
    "brotli",
] }

# 异步运行时（FRB 自带运行库；此处供 core 独立单测使用）
# net/io-util：斗鱼弹幕的明文 TCP 帧源（ADR-015）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
futures-util = "0.3"

# 协议辅助
regex = "1"
md-5 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["std"] }
once_cell = "1"

# 弹幕 op5 载荷解压（ver2=zlib / ver3=brotli；纯 Rust 后端，见 ADR-003）
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "7"

# 平台协议（IP-3~6 预置，避免多任务并行改 Cargo.toml）
# ⚠️ tars-stream 0.1.1 依赖 nightly（#![feature(specialization)] 等）stable 编不过 ——
#    斗鱼/虎牙的 TARS 编解码照 Dart `packages/tars_dart` 手写（行为对齐 Dart core）
# 抖音：protobuf 弹幕（手写 prost::Message 结构对照 proto，免 protoc/build.rs）
prost = "0.12"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
