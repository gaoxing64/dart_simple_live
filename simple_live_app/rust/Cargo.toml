[package]
name = "rust_lib_simple_live_app"
version = "0.1.0"
edition = "2021"

[lib]
# rlib 供集成测试（manual_e2e 等）链接；cargokit 的移动端构建不受影响
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono"] }
regex = "1.12.2"
xxhash-rust = { version = "0.8.5", features = ["xxh3"] }
lazy_static = "1.4.0"
chrono = "0.4"
slive-core = { path = "crates/slive-core" }
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }

# 弹幕 WSS 的 TLS 后端按平台分层（ADR-013，supersedes ADR-003#2）：
# 桌面 native-tls —— 斗鱼弹幕服务器对 rustls ClientHello 指纹风控，仅放行系统 TLS
# （2026-10-17 真机实证）；移动 rustls —— 保「移动端零 OpenSSL/NDK C 依赖」。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }

[workspace]
members = ["crates/slive-core"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
